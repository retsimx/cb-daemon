# Example cb-daemon configuration.
# Copy to /etc/cb-daemon/config.toml or ./config.toml, or pass --config <path>.
# Precedence: defaults → this file → env (CB_DAEMON_*) → CLI (CLI wins).

# Link backend: "mock" | "aoa" | "tty"
backend = "aoa"

# Pi Zero W (Alpine, OpenRC) deployment — tty backend:
#   backend = "tty"
#   device = "/dev/ttyUSB0"
#   bind = "0.0.0.0:2026"

# Device path (required absolute path for aoa/tty when set; defaults to
# /dev/usb_accessory or /dev/ttyUSB0 when omitted).
device = "/dev/usb_accessory"

# HTTP / WebSocket listen address
bind = "127.0.0.1:2026"

# Optional 5-hex unit id hint (logged at startup; not consumed by negotiate in D9)
unit_id_hint = "11111"

# Tracing level when RUST_LOG is unset: error | warn | info | debug | trace
log_level = "info"

# AOA payload max chunk size (≥ 1)
aoa_chunk_size = 63

# AOA inter-chunk delay in milliseconds
aoa_chunk_delay_ms = 1

# TTY baud rate (e.g. 9600, 19200, 38400, 57600, 115200, 230400)
tty_baud = 57600

# WebSocket idle failsafe: minutes with zero connected WS clients before all
# aircon units are powered off; 0 disables the failsafe entirely.
# ws_idle_timeout_minutes = 15

# Seconds between power-off retries while still disconnected (>= 1)
# ws_idle_retry_seconds = 60

# WebSocket keepalive: daemon-initiated pings every interval seconds; sessions
# silent for pong_timeout seconds are closed (pong_timeout >= interval).
# keepalive_interval_seconds = 30
# keepalive_pong_timeout_seconds = 75

# Seconds a connecting client waits for the first engine snapshot before
# receiving a link_down status and being closed (engine-down connect).
# snapshot_timeout_seconds = 15
