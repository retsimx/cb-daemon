[package]
name = "cb-daemon"
version.workspace = true
edition.workspace = true
description = "Control Box mailbox sync daemon: link + engine + axum WebSocket"

[dependencies]
aa-frame = { path = "../aa-frame" }
aa-link = { path = "../aa-link" }
aa-engine = { path = "../aa-engine" }
aa-mailbox = { path = "../aa-mailbox" }
aa-registers = { path = "../aa-registers" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.26", features = ["connect"] }

[lints]
workspace = true
